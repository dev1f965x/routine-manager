name: routine_manager
description: "Daily routine tracker with streaks."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  path: ^1.9.0
  sqflite: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Runs sqflite on the host so widget tests can open a real database.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
